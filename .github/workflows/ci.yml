name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests and static checks
        run: npm test
      - name: Browser smoke test
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
